name: Update Investment Returns Calculator

on:
  schedule:
    # Run at 00:00 on the 1st of every 3rd month
    - cron: '0 0 1 */3 *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-calculator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance beautifulsoup4 requests

      - name: Run Update Script
        run: python scripts/update_calculator.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add invest.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update calculator returns" && git push)
