name: Auto Update Calcalist Market News

on:
  schedule:
    # Runs at 04:00, 08:00, 12:00, 16:00 UTC (07:00, 11:00, 15:00, 19:00 Israel Time) Sunday-Friday
    - cron: '0 4,8,12,16 * * 0-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Calcalist Live News Fetcher
        run: node update_calcalist.js

      - name: Commit and push if news updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/market_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Calcalist market news [skip ci]" && git push)
