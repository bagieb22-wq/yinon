name: Update Market Returns

on:
  schedule:
    - cron: '0 0 1 * *' # Run on the 1st of every month at midnight
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          
      - name: Run update script
        run: python scripts/update_returns.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/market_returns.json invest.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market returns" && git push)
